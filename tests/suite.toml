[[coverage]]
case = "native.recovery-capture-core.storage::recovery_capture::tests::switch_worker_retains_all_four_leases_after_coordinator_descriptors_close"
capability = "postgres"
operation = "harbor-db-postgres.capture-backup"
dimension = "concurrency"
evidence = "A controlled actual switch worker inherits all four owned persistent anchors. After the coordinator's originals close, real contenders still fail with EAGAIN until the worker finishes; every original lock inode survives release. The worker is a lease fixture, not an actual PostgreSQL producer."

[[coverage]]
case = "native.recovery-capture-core.storage::recovery_capture::tests::occupied_snapshot_preserves_previous_generation_then_retry_commits_once"
capability = "postgres"
operation = "harbor-db-postgres.capture-backup"
dimension = "recovery"
evidence = "Actual immutable publication fails at an occupied generation-snapshot destination while preserving the previous selected metadata/snapshot bytes and inodes. Explicit retry after the collision is removed publishes the new generation before selecting it; repetition preserves all generation and selector inodes. This is filesystem publication recovery, not worker-kill or physical replay evidence."

[[coverage]]
