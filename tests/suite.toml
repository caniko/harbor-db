dimension = "positive"
evidence = "The fixture requires real generated loopback basebackup/receivewal services, acknowledged post-backup inserts/updates/deletes, retained native writer exclusion, producer-created immutable pin/metadata/snapshot and complete receiver WAL. A distinct certifier restores those artifacts, reaches the measured target and compares exact nonempty full Unicode/binary records before source admission. Registration requires actual passing JUnit and case-bound semantic receipt to qualify."

[[coverage]]
