# cargo-test already realizes all-targets/all-features native storage and harness tests.
# Native ARM rows qualify both packages and all eight original non-VM gates.
# Generated with Simit de3325be17104fbdb0d70f1da38149d4016f1790 (Canix's
# qualified simit-ci-generator pin), realized from
# github:caniko/simit/de3325be17104fbdb0d70f1da38149d4016f1790#default.
# Generator SHA-256: a8b6be1cc52f27a37473abfb346b959ab9f65be435904baad75fb7381415ab10.
# Grouped jobs provision the engine from the repository variable
# SIMIT_CI_ENGINE_REVISION, enrolled at the same revision.
# Regenerate: simit init ci --platform github --ci-provider actions --runtime nix
# Verify with the same command plus --check --diff, then retain native ARM runs.
# The ten native VM checks are exported only on x86_64-linux and require KVM.
[ci.nix_build]
only = true
# Pull requests qualify their exact head once; trunk keeps its push run.
push_branches = ["trunk"]
timeout_minutes = 90
# Four groups run at once, the runner budget of the former push and PR pair.
max_parallel = 4
max_jobs = 1
cores = 4
kvm = true
capture_results = true
artifact_retention_days = 14
extra_setup = ['''
test "${RUNNER_ENVIRONMENT:-}" = github-hosted
# Ubuntu's AppArmor restriction denies UID mapping by Nix-store unshare.
# Enable the namespace substrate on this disposable hosted runner; the
# mandatory in-sandbox probe and all namespace rejection tests still run.
sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
sudo install -d -m 1777 -o root -g root /var/cache/sccache
test ! -L /var/cache/sccache
test "$(stat -c '%u:%a' /var/cache/sccache)" = 0:1777
printf '%s\n' 'extra-sandbox-paths = /var/cache/sccache' 'log-lines = 250' | sudo tee -a /etc/nix/nix.conf
sudo systemctl restart nix-daemon.service
nix config show sandbox-paths | grep -F /var/cache/sccache
''']

[ci.nix_build.system_runners]
"aarch64-linux" = "ubuntu-24.04-arm"
"x86_64-linux" = "ubuntu-24.04"

# Jobs share one store per group, so each builds the toolchain, harbor-db and
# harbor-db-test once instead of once per installable. Every grouped job also
# provisions the Simit engine (about 8 minutes), so groups stay few and large.
# The compressed Btrfs crash fixture still runs first, within its VM group.
[ci.nix_build.groups]
aarch64 = [
  ".#packages.aarch64-linux.storage-lifecycle-rust",
  ".#packages.aarch64-linux.harbor-db-test",
  ".#checks.aarch64-linux.cargo-test",
