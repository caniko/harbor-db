          - group: "aarch64"
            installables: '[".#packages.aarch64-linux.storage-lifecycle-rust",".#packages.aarch64-linux.harbor-db-test",".#checks.aarch64-linux.cargo-test",".#checks.aarch64-linux.cutover-eval",".#checks.aarch64-linux.native-cli-smoke",".#checks.aarch64-linux.native-package-eval",".#checks.aarch64-linux.native-storage-eval",".#checks.aarch64-linux.postgres-lifecycle-eval",".#checks.aarch64-linux.application-provision-eval",".#checks.aarch64-linux.module-eval"]'
            system: "aarch64-linux"
            runner: "ubuntu-24.04-arm"
          - group: "x86-lifecycle-vm"
            installables: '[".#checks.x86_64-linux.btrfs-crash",".#checks.x86_64-linux.module-smoke",".#checks.x86_64-linux.postgres-crash-rollback",".#checks.x86_64-linux.postgres-interrupted-upgrade",".#checks.x86_64-linux.postgres-recovery-acceptance",".#checks.x86_64-linux.postgres-writer-fence",".#checks.x86_64-linux.application-provision",".#checks.x86_64-linux.application-backup",".#checks.x86_64-linux.application-transition",".#checks.x86_64-linux.application-postgres-transition"]'
            system: "x86_64-linux"
            runner: "ubuntu-24.04"
          - group: "x86-native-vm"
            installables: '[".#checks.x86_64-linux.native-supervisor",".#checks.x86_64-linux.native-postgres-backup-service",".#checks.x86_64-linux.native-source-local-recovery",".#checks.x86_64-linux.native-postgres-crash-rollback",".#checks.x86_64-linux.native-postgres-interrupted-upgrade",".#checks.x86_64-linux.native-postgres-recovery-acceptance",".#checks.x86_64-linux.native-postgres-writer-fence",".#checks.x86_64-linux.native-application-provision",".#checks.x86_64-linux.native-application-backup",".#checks.x86_64-linux.native-application-transition",".#checks.x86_64-linux.native-application-postgres-transition"]'
            system: "x86_64-linux"
            runner: "ubuntu-24.04"
          - group: "x86-rust"
            installables: '[".#checks.x86_64-linux.cargo-fmt",".#packages.x86_64-linux.storage-lifecycle-rust",".#packages.x86_64-linux.storage-lifecycle",".#packages.x86_64-linux.harbor-db-test",".#packages.x86_64-linux.harbor-db-cached",".#checks.x86_64-linux.harbor-db",".#checks.x86_64-linux.cargo-clippy",".#checks.x86_64-linux.cargo-test",".#checks.x86_64-linux.cargo-doc",".#checks.x86_64-linux.postgres-lifecycle-test",".#checks.x86_64-linux.postgres-lifecycle-oracle-test",".#checks.x86_64-linux.native-package-eval",".#checks.x86_64-linux.native-storage-eval",".#checks.x86_64-linux.native-cli-smoke",".#checks.x86_64-linux.cutover-eval",".#checks.x86_64-linux.postgres-lifecycle-eval",".#checks.x86_64-linux.application-provision-eval",".#checks.x86_64-linux.pg-backup-eval",".#checks.x86_64-linux.module-eval"]'
