    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Nix build evidence
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Verify native Nix runner
        env:
          EXPECTED_NIX_SYSTEM: ${{ matrix.system }}
          BASH_ENV: ''
          ENV: ''
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          case "$machine" in
            arm64) machine=aarch64 ;;
            amd64) machine=x86_64 ;;
            i386|i486|i586) machine=i686 ;;
            ppc) machine=powerpc ;;
            ppcle) machine=powerpcle ;;
            ppc64) machine=powerpc64 ;;
            ppc64le) machine=powerpc64le ;;
          esac
          kernel="$(uname -s)"
          case "$kernel" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            FreeBSD) os=freebsd ;;
            *) echo "Unsupported native Nix runner kernel: $kernel" >&2; exit 1 ;;
          esac
          actual_system="$machine-$os"
          if [ "$actual_system" != "$EXPECTED_NIX_SYSTEM" ]; then
            echo "Native Nix runner mismatch: expected $EXPECTED_NIX_SYSTEM, got hardware $actual_system" >&2
            exit 1
          fi
          nix_system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          if [ "$nix_system" != "$EXPECTED_NIX_SYSTEM" ]; then
            echo "Native Nix runner mismatch: expected $EXPECTED_NIX_SYSTEM, got configured Nix system $nix_system" >&2
            exit 1
          fi
          printf 'Verified native hardware %s and Nix system %s\n' "$actual_system" "$nix_system"
      - name: Provision grouped-build Rust engine
        shell: bash
        env:
          SIMIT_CI_ENGINE_REVISION: ${{ vars.SIMIT_CI_ENGINE_REVISION }}
          BASH_ENV: ''
          ENV: ''
          NIX_CONFIG: 'experimental-features = nix-command flakes'
          NIX_USER_CONF_FILES: /dev/null
          NIX_PATH: ''
        run: |
          [[ "$SIMIT_CI_ENGINE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll an immutable SIMIT_CI_ENGINE_REVISION containing ci nix-group' >&2; exit 1; }
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64|Linux:aarch64|Linux:arm64|Darwin:arm64|Darwin:aarch64) ;;
            *) echo 'unsupported grouped engine runner system' >&2; exit 1 ;;
          esac
          engine_path=$(env -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_OAUTH_TOKEN -u ATTIC_TOKEN -u CACHIX_AUTH_TOKEN -u CACHIX_SIGNING_KEY nix build --no-link --no-update-lock-file --print-out-paths --option accept-flake-config false --option access-tokens '' --option substituters https://cache.nixos.org "github:caniko/simit/$SIMIT_CI_ENGINE_REVISION#default")
          [[ "$engine_path" =~ ^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$ ]] || { echo 'Invalid engine output inventory' >&2; exit 1; }
          test -x "$engine_path/bin/simit"
          "$engine_path/bin/simit" ci nix-group --help > /dev/null
          printf '%s\n' "$SIMIT_CI_ENGINE_REVISION" > "$SIMIT_NIX_BUILD_RESULTS/engine-source-revision"
          engine_digest=$(nix hash file --type sha256 --base16 "$engine_path/bin/simit")
          printf '%s  %s\n' "$engine_digest" "$engine_path/bin/simit" > "$SIMIT_NIX_BUILD_RESULTS/engine-executable.sha256"
          printf '%s\n' "SIMIT_CI_ENGINE=$engine_path/bin/simit" >> "$GITHUB_ENV"
      - name: Enable hosted KVM
        if: ${{ matrix.system == 'x86_64-linux' }}
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Project setup
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          # Ubuntu's AppArmor restriction denies UID mapping by Nix-store unshare.
          # Enable the namespace substrate on this disposable hosted runner; the
          # mandatory in-sandbox probe and all namespace rejection tests still run.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
          sudo install -d -m 1777 -o root -g root /var/cache/sccache
          test ! -L /var/cache/sccache
          test "$(stat -c '%u:%a' /var/cache/sccache)" = 0:1777
          printf '%s\n' 'extra-sandbox-paths = /var/cache/sccache' 'log-lines = 250' | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon.service
          nix config show sandbox-paths | grep -F /var/cache/sccache

