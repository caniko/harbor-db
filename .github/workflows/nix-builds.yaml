      - name: Upload Nix build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: nix-build-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/simit-nix-build-${{ strategy.job-index }}
