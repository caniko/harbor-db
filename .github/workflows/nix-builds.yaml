# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.installable }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - installable: ".#checks.x86_64-linux.btrfs-crash"
            system: "x86_64-linux"
            runner: "ubuntu-24.04"
